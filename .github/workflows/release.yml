name: Package draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            name: Windows x64 NSIS installer
            os: windows-2025
            ffmpeg: windows
            builderArgs: --win nsis --x64
            artifacts: release/*.exe
          - id: linux-x64
            name: Linux x64 AppImage and deb
            os: ubuntu-24.04
            ffmpeg: linux
            builderArgs: --linux AppImage deb --x64
            artifacts: |
              release/*.AppImage
              release/*.deb
              release/*-sbom.cdx.json
          - id: mac-arm64
            name: macOS arm64 DMG and ZIP
            os: macos-26
            ffmpeg: macos
            builderArgs: --mac dmg zip
            artifacts: |
              release/*.dmg
              release/*.zip
          - id: mac-x64
            name: macOS Intel DMG and ZIP
            os: macos-26-intel
            ffmpeg: macos
            builderArgs: --mac dmg zip
            artifacts: |
              release/*.dmg
              release/*.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.13.0
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) { console.error('Tag must match package.json version.'); process.exit(1) }"
      - name: Install FFmpeg on Windows
        if: matrix.ffmpeg == 'windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Install FFmpeg on Linux
        if: matrix.ffmpeg == 'linux'
        run: bash scripts/install-ffmpeg-linux.sh
      - name: Install FFmpeg on macOS
        if: matrix.ffmpeg == 'macos'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - run: npm run build
      - name: Verify FFmpeg features used by the editor
        run: node scripts/verify-ffmpeg-ci.cjs
      - run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ClipPulse-agent-e2e-report-${{ github.ref_name }}-${{ matrix.id }}
          path: test-results/agent-e2e-*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run CLI, media, export, and MCP smoke tests
        run: npm run smoke-test
      - name: Build native package
        run: node scripts/build-native-package.cjs ${{ matrix.builderArgs }} --publish never
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Smoke-test clean Windows install
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath release -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          ./scripts/smoke-test-windows-installer.ps1 -InstallerPath $installer.FullName
      - name: Verify Linux AppImage permissions
        if: matrix.id == 'linux-x64'
        run: |
          appimage="$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage" || { echo 'AppImage was not produced.'; exit 1; }
          test -x "$appimage" || { echo "AppImage is missing its executable bit: $appimage"; exit 1; }
      - name: Generate CycloneDX SBOM
        if: matrix.id == 'linux-x64'
        run: npm sbom --sbom-format=cyclonedx --sbom-type=application > "release/ClipPulse-${GITHUB_REF_NAME}-sbom.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ClipPulse-${{ github.ref_name }}-${{ matrix.id }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Assemble draft release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ClipPulse-${{ github.ref_name }}-*
          path: release
          merge-multiple: true
      - name: Add versioned release status and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          status_file="ClipPulse-${RELEASE_TAG}-RELEASE-STATUS.md"
          checksum_file="ClipPulse-${RELEASE_TAG}-SHA256SUMS.txt"
          cat > "release/${status_file}" <<EOF
          This is an automatically assembled draft for ${RELEASE_TAG}. Review platform installation, license notices, and signing before publishing it.

          Windows and macOS signing are enabled only when the matching repository Actions secrets are configured. FFmpeg is a separate user-installed dependency. The CycloneDX SBOM lists the locked npm dependency tree; it does not include FFmpeg or the model downloaded on first use.
          EOF
          (
            cd release
            for file in *; do
              [[ "$file" == "${checksum_file}" ]] && continue
              sha256sum "$file"
            done
          ) > "release/${checksum_file}"
          (cd release && sha256sum --check "${checksum_file}")
      - name: Refuse to modify an existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to change it."
            exit 1
          fi
      - name: Create GitHub draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="V${GITHUB_REF_NAME#v}_RELEASE_NOTES.md"
          if [[ -f "$notes_file" ]]; then
            gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes-file "$notes_file" --draft --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes --draft --verify-tag
          fi
